<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Bourbon Trail Passport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #120c0a;
            color: #f3ece6;
            touch-action: manipulation;
        }
        .cinzel { font-family: 'Cinzel', serif; }
        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 50%, #f3e5ab 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .passport-card {
            background: linear-gradient(145deg, #1c1410 0%, #2b1e17 100%);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.7);
        }
        .stamp-active {
            border-color: #d4af37 !important;
            background: rgba(212, 175, 55, 0.08);
        }
        /* Hide scrollbar for chrome, safari and opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-20">

    <!-- Top Navigation / Header -->
    <header class="bg-[#18110e] border-b border-[#3a2920] sticky top-0 z-40 px-4 py-3 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="cinzel text-lg font-bold tracking-wider gold-gradient">Kentucky Bourbon Trail</h1>
                <p id="headerName" class="text-xs text-[#a39082]">Traveler Passport</p>
            </div>
            <button onclick="openSettings()" class="text-[#d4af37] bg-[#2a1e17] border border-[#d4af37]/30 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 shadow active:scale-95 transition">
                <i class="fa-solid fa-user-gear"></i> <span id="headerTravelerBtn">Profile</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto w-full px-4 pt-4 flex-grow">

        <!-- Global Summary Pill -->
        <div class="bg-[#241914] border border-[#d4af37]/30 rounded-xl p-3 mb-4 shadow-lg flex justify-around text-center">
            <div>
                <span class="block text-[10px] uppercase tracking-wider text-[#a39082]">Flights</span>
                <span id="globalFlights" class="cinzel text-lg font-bold text-[#d4af37]">0</span>
            </div>
            <div class="border-r border-[#3a2920]"></div>
            <div>
                <span class="block text-[10px] uppercase tracking-wider text-[#a39082]">Cocktails</span>
                <span id="globalCocktails" class="cinzel text-lg font-bold text-[#d4af37]">0</span>
            </div>
            <div class="border-r border-[#3a2920]"></div>
            <div>
                <span class="block text-[10px] uppercase tracking-wider text-[#a39082]">Pours</span>
                <span id="globalPours" class="cinzel text-lg font-bold text-[#d4af37]">0</span>
            </div>
            <div class="border-r border-[#3a2920]"></div>
            <div>
                <span class="block text-[10px] uppercase tracking-wider text-[#a39082]">Total</span>
                <span id="globalTotal" class="cinzel text-lg font-bold text-white">0</span>
            </div>
        </div>

        <!-- Day Carousel Controls -->
        <div class="flex items-center justify-between mb-3 bg-[#1a120e] p-2 rounded-xl border border-[#3a2920]">
            <button onclick="changeDay(-1)" class="w-10 h-10 rounded-lg bg-[#2a1e17] text-[#d4af37] border border-[#d4af37]/30 flex items-center justify-center active:scale-90 transition hover:bg-[#38271f]">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <div class="text-center">
                <span id="dayIndicatorTitle" class="cinzel font-bold text-base text-[#f3ece6] block">DAY 1</span>
                <span id="dayIndicatorSubtitle" class="text-xs text-[#d4af37]">Flight & Pre-Tour</span>
            </div>
            <button onclick="changeDay(1)" class="w-10 h-10 rounded-lg bg-[#2a1e17] text-[#d4af37] border border-[#d4af37]/30 flex items-center justify-center active:scale-90 transition hover:bg-[#38271f]">
                <i class="fa-solid fa-chevron-right text-sm"></i>
            </button>
        </div>

        <!-- Swipeable Days Container -->
        <div id="daysWrapper" class="overflow-hidden relative touch-pan-y">
            <div id="daysSlider" class="flex transition-transform duration-300 ease-out w-full">
                <!-- Days will be dynamically injected here -->
            </div>
        </div>
    </main>

    <!-- Bottom Action Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#160f0c] border-t border-[#3a2920] py-2.5 px-4 z-40">
        <div class="max-w-md mx-auto flex justify-between items-center text-xs text-[#a39082]">
            <button onclick="goToDay(0)" id="navDay0" class="flex flex-col items-center gap-1 flex-1 py-1 text-[#d4af37] font-semibold transition">
                <i class="fa-solid fa-plane-departure text-base"></i>
                <span>Day 1</span>
            </button>
            <button onclick="goToDay(1)" id="navDay1" class="flex flex-col items-center gap-1 flex-1 py-1 hover:text-[#d4af37] transition">
                <i class="fa-solid fa-map-location-dot text-base"></i>
                <span>Day 2: Franktown</span>
            </button>
            <button onclick="resetDataPrompt()" class="flex flex-col items-center gap-1 py-1 px-3 text-red-400 hover:text-red-300 transition">
                <i class="fa-solid fa-rotate-right text-base"></i>
                <span>Reset</span>
            </button>
        </div>
    </nav>

    <!-- Profile & Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#1f1511] border border-[#d4af37]/40 rounded-2xl w-full max-w-sm p-5 shadow-2xl relative">
            <button onclick="closeSettings()" class="absolute top-4 right-4 text-[#a39082] hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="cinzel text-lg font-bold text-[#d4af37] mb-1 flex items-center gap-2"><i class="fa-solid fa-id-card"></i> Passport Bio</h3>
            <p class="text-xs text-[#a39082] mb-4">Personalize your Kentucky Bourbon Trail booklet.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-[#a39082] mb-1">Traveler Name</label>
                    <input type="text" id="inputName" class="w-full bg-[#120c0a] border border-[#3a2920] rounded-xl px-3 py-2 text-sm text-white focus:border-[#d4af37] outline-none" placeholder="e.g. Jack Daniel">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-[#a39082] mb-1">Passport Number</label>
                    <input type="text" id="inputPassNum" class="w-full bg-[#120c0a] border border-[#3a2920] rounded-xl px-3 py-2 text-sm text-[#d4af37] font-mono focus:border-[#d4af37] outline-none" placeholder="KBT-8894">
                </div>
            </div>
            
            <button onclick="saveSettings()" class="w-full mt-5 bg-gradient-to-r from-[#aa7c11] to-[#d4af37] text-black font-bold py-2.5 rounded-xl shadow text-sm active:scale-98 transition">Save Credentials</button>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        // App Data Structure
        const itinerary = [
            {
                dayNum: 1,
                title: "Day 1",
                subtitle: "Flight & Pre-Tour",
                locations: [
                    { id: "d1_airport", name: "Airport & Departure Lounges", type: "Travel / Transit" },
                    { id: "d1_hotel", name: "Arrival & Hotel Check-in", type: "Lodging" },
                    { id: "d1_dinner", name: "Welcome Dinner Bar & Drinks", type: "Dining" }
                ]
            },
            {
                dayNum: 2,
                title: "Day 2",
                subtitle: "Franktown & Historic Distilleries",
                locations: [
                    { id: "d2_buffalotrace", name: "Buffalo Trace Distillery", type: "Distillery Tour & Tasting" },
                    { id: "d2_castlekey", name: "Castle & Key Distillery", type: "Distillery & Grounds" },
                    { id: "d2_whiskeythief", name: "Whiskey Thief Distilling Co.", type: "Thief Tasting Experience" },
                    { id: "d2_woodford", name: "Woodford Reserve Distillery", type: "Historic Distillery" }
                ]
            }
        ];

        let currentDayIndex = 0;
        let userData = {
            name: "Bourbon Explorer",
            passNum: "KBT-" + Math.floor(1000 + Math.random() * 9000),
            counts: {}, // format: { locationId: { flights: 0, cocktails: 0, pours: 0, stamped: false, notes: "" } }
        };

        // Initialize state
        function initApp() {
            const saved = localStorage.getItem('kbt_passport_data_v2');
            if (saved) {
                try { userData = JSON.parse(saved); } catch(e) {}
            }
            
            // Ensure data buckets exist for all stops
            itinerary.forEach(day => {
                day.locations.forEach(loc => {
                    if (!userData.counts[loc.id]) {
                        userData.counts[loc.id] = { flights: 0, cocktails: 0, pours: 0, stamped: false, notes: "" };
                    }
                });
            });

            document.getElementById('inputName').value = userData.name;
            document.getElementById('inputPassNum').value = userData.passNum;
            document.getElementById('headerName').innerText = userData.name + " (" + userData.passNum + ")";

            renderDays();
            updateGlobalCounters();
            updateCarouselView();
            setupSwipeDetection();
        }

        function saveState() {
            localStorage.setItem('kbt_passport_data_v2', JSON.stringify(userData));
            updateGlobalCounters();
        }

        // Render Carousel Days HTML
        function renderDays() {
            const slider = document.getElementById('daysSlider');
            slider.innerHTML = '';

            itinerary.forEach((day, dIdx) => {
                const dayDiv = document.createElement('div');
                dayDiv.className = "w-full flex-shrink-0 px-0.5 space-y-3.5";
                
                let locsHTML = '';
                day.locations.forEach(loc => {
                    const stats = userData.counts[loc.id];
                    const isStamped = stats.stamped;
                    const totalLocDrinks = stats.flights + stats.cocktails + stats.pours;

                    locsHTML += `
                        <div class="passport-card rounded-2xl p-4 transition duration-200 ${isStamped ? 'stamp-active' : ''}" id="card_${loc.id}">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <span class="text-[10px] font-semibold uppercase tracking-wider text-[#a39082] block">${loc.type}</span>
                                    <h4 class="cinzel font-bold text-base text-[#f3ece6]">${loc.name}</h4>
                                </div>
                                <button onclick="toggleStamp('${loc.id}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold border flex items-center gap-1.5 transition ${isStamped ? 'bg-[#d4af37] text-black border-[#d4af37] shadow-md shadow-[#d4af37]/20' : 'bg-[#120c0a] text-[#a39082] border-[#3a2920] hover:text-[#d4af37]'}">
                                    <i class="fa-solid fa-stamp"></i> ${isStamped ? 'Stamped' : 'Stamp Book'}
                                </button>
                            </div>

                            <!-- Counters Grid -->
                            <div class="grid grid-cols-3 gap-2 my-3">
                                <!-- Flight -->
                                <div class="bg-[#120c0a] border border-[#3a2920] rounded-xl p-2 text-center">
                                    <span class="block text-[9px] uppercase tracking-wider text-[#a39082] mb-1">Flight</span>
                                    <div class="flex items-center justify-between">
                                        <button onclick="adjustCount('${loc.id}', 'flights', -1)" class="w-6 h-6 rounded bg-[#2a1e17] text-[#d4af37] flex items-center justify-center font-bold active:scale-75 transition"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                        <span id="cnt_${loc.id}_flights" class="cinzel font-bold text-sm text-[#d4af37]">${stats.flights}</span>
                                        <button onclick="adjustCount('${loc.id}', 'flights', 1)" class="w-6 h-6 rounded bg-[#2a1e17] text-[#d4af37] flex items-center justify-center font-bold active:scale-75 transition"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                    </div>
                                </div>
                                <!-- Cocktail -->
                                <div class="bg-[#120c0a] border border-[#3a2920] rounded-xl p-2 text-center">
                                    <span class="block text-[9px] uppercase tracking-wider text-[#a39082] mb-1">Cocktail</span>
                                    <div class="flex items-center justify-between">
                                        <button onclick="adjustCount('${loc.id}', 'cocktails', -1)" class="w-6 h-6 rounded bg-[#2a1e17] text-[#d4af37] flex items-center justify-center font-bold active:scale-75 transition"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                        <span id="cnt_${loc.id}_cocktails" class="cinzel font-bold text-sm text-[#d4af37]">${stats.cocktails}</span>
                                        <button onclick="adjustCount('${loc.id}', 'cocktails', 1)" class="w-6 h-6 rounded bg-[#2a1e17] text-[#d4af37] flex items-center justify-center font-bold active:scale-75 transition"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                    </div>
                                </div>
                                <!-- Pour -->
                                <div class="bg-[#120c0a] border border-[#3a2920] rounded-xl p-2 text-center">
                                    <span class="block text-[9px] uppercase tracking-wider text-[#a39082] mb-1">Pour</span>
                                    <div class="flex items-center justify-between">
                                        <button onclick="adjustCount('${loc.id}', 'pours', -1)" class="w-6 h-6 rounded bg-[#2a1e17] text-[#d4af37] flex items-center justify-center font-bold active:scale-75 transition"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                        <span id="cnt_${loc.id}_pours" class="cinzel font-bold text-sm text-[#d4af37]">${stats.pours}</span>
                                        <button onclick="adjustCount('${loc.id}', 'pours', 1)" class="w-6 h-6 rounded bg-[#2a1e17] text-[#d4af37] flex items-center justify-center font-bold active:scale-75 transition"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                    </div>
                                </div>
                            </div>

                            <!-- Notes Section -->
                            <div class="mt-2">
                                <input type="text" value="${stats.notes}" onchange="updateNotes('${loc.id}', this.value)" placeholder="Add tasting notes, favorite pour, or proof..." class="w-full bg-[#120c0a] border border-[#3a2920] rounded-lg px-2.5 py-1.5 text-xs text-[#f3ece6] placeholder-[#6b584c] focus:border-[#d4af37] outline-none">
                            </div>
                        </div>
                    `;
                });

                dayDiv.innerHTML = `<div class="space-y-3 pb-6">${locsHTML}</div>`;
                slider.appendChild(dayDiv);
            });
        }

        // Adjust Count Function (+/-)
        function adjustCount(locId, type, delta) {
            let currentVal = userData.counts[locId][type];
            let newVal = currentVal + delta;
            if (newVal < 0) newVal = 0;
            
            userData.counts[locId][type] = newVal;
            document.getElementById(`cnt_${locId}_${type}`).innerText = newVal;
            
            // Auto stamp if incrementing and not already stamped
            if (delta > 0 && !userData.counts[locId].stamped) {
                userData.counts[locId].stamped = true;
                const card = document.getElementById(`card_${locId}`);
                if (card) card.classList.add('stamp-active');
                renderDays(); // refresh stamp button state
            }
            
            saveState();
        }

        // Toggle Stamp
        function toggleStamp(locId) {
            userData.counts[locId].stamped = !userData.counts[locId].stamped;
            saveState();
            renderDays();
        }

        // Update Notes
        function updateNotes(locId, val) {
            userData.counts[locId].notes = val;
            saveState();
        }

        // Global Counters tally
        function updateGlobalCounters() {
            let totalF = 0, totalC = 0, totalP = 0;
            Object.values(userData.counts).forEach(c => {
                totalF += c.flights;
                totalC += c.cocktails;
                totalP += c.pours;
            });

            document.getElementById('globalFlights').innerText = totalF;
            document.getElementById('globalCocktails').innerText = totalC;
            document.getElementById('globalPours').innerText = totalP;
            document.getElementById('globalTotal').innerText = totalF + totalC + totalP;
        }

        // Carousel Movement
        function changeDay(direction) {
            let newIndex = currentDayIndex + direction;
            if (newIndex >= 0 && newIndex < itinerary.length) {
                goToDay(newIndex);
            }
        }

        function goToDay(index) {
            currentDayIndex = index;
            updateCarouselView();
        }

        function updateCarouselView() {
            const slider = document.getElementById('daysSlider');
            slider.style.transform = `translateX(-${currentDayIndex * 100}%)`;

            // Update Header Display
            const dayObj = itinerary[currentDayIndex];
            document.getElementById('dayIndicatorTitle').innerText = dayObj.title.toUpperCase();
            document.getElementById('dayIndicatorSubtitle').innerText = dayObj.subtitle;

            // Highlight Bottom Bar Nav
            document.getElementById('navDay0').className = currentDayIndex === 0 ? "flex flex-col items-center gap-1 flex-1 py-1 text-[#d4af37] font-semibold transition" : "flex flex-col items-center gap-1 flex-1 py-1 text-[#a39082] hover:text-[#d4af37] transition";
            document.getElementById('navDay1').className = currentDayIndex === 1 ? "flex flex-col items-center gap-1 flex-1 py-1 text-[#d4af37] font-semibold transition" : "flex flex-col items-center gap-1 flex-1 py-1 text-[#a39082] hover:text-[#d4af37] transition";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Swipe Gesture Detection
        function setupSwipeDetection() {
            const slider = document.getElementById('daysSlider');
            let startX = 0;
            let endX = 0;

            slider.addEventListener('touchstart', e => {
                startX = e.changedTouches[0].screenX;
            }, { passive: true });

            slider.addEventListener('touchend', e => {
                endX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const threshold = 50;
                if (startX - endX > threshold) {
                    // Swiped Left -> Next Day
                    changeDay(1);
                } else if (endX - startX > threshold) {
                    // Swiped Right -> Previous Day
                    changeDay(-1);
                }
            }
        }

        // Profile Settings Modal
        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveSettings() {
            userData.name = document.getElementById('inputName').value || "Bourbon Explorer";
            userData.passNum = document.getElementById('inputPassNum').value || "KBT-0001";
            document.getElementById('headerName').innerText = userData.name + " (" + userData.passNum + ")";
            saveState();
            closeSettings();
        }

        function resetDataPrompt() {
            if (confirm("Are you sure you want to reset all stamps and drink tallies?")) {
                localStorage.removeItem('kbt_passport_data_v2');
                location.reload();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
